specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Navan
providerId: navan
created: '2026-07-03'
modified: '2026-07-03'
reconciled: false
tags:
- Corporate Travel
- Expense Management
- Corporate Cards
- Spend Management
- Plans
description: >-
  Navan (formerly TripActions) does not publish fixed list pricing; pricing is
  quoted per company based on size, travel volume, geography, and negotiated
  terms. There are three commonly referenced commercial motions: Business Travel
  at no platform fee (funded by supplier commissions and per-trip booking fees),
  Business Expense as a per-user subscription (widely reported around $15 per
  user per month with a small number of users free), and a custom Enterprise
  agreement for unified travel + expense (T&E), typically for larger
  organizations. The developer API is not sold as a separate metered product -
  API access is included with the underlying Navan subscription, and expense
  data retrieval via the API does not carry its own per-call fee.
notes: >-
  Exact per-user rates, free-user thresholds, and booking-fee schedules vary by
  contract and region and are not reconciled here. Verify current terms with
  Navan sales and on navan.com/pricing. API access requires an active Navan
  subscription; credentials are generated by an admin in Settings > Integrations.
sources:
- https://navan.com/pricing
- https://developer.navan.com/
- https://www.g2.com/products/navan-formerly-tripactions/pricing
plans:
- id: navan-business-travel
  name: Business Travel
  type: free
  description: >-
    Corporate travel booking and management with no monthly platform fee. Navan
    monetizes travel through supplier commissions and per-trip booking/service
    fees rather than a per-seat charge. Includes the travel booking surface,
    policy controls, and booking data available via API (bookings:read).
  entries:
  - label: Platform Fee
    name: travel_platform_fee
    type: flat
    metric: subscription
    limit: -1
    timeFrame: month
    geo: global
    unit: 1
    price: $0 platform fee (booking/service fees apply per trip)
    userMultiplied: false
  elements:
  - name: Travel Booking
  - name: Travel Policy Controls
  - name: Booking Data API
  - name: User Management API
- id: navan-business-expense
  name: Business Expense
  type: paid
  description: >-
    Expense management and corporate cards billed per active user per month,
    commonly reported around $15/user/month with a small number of users free.
    Includes the Expense API surface (transactions, fees, adjustments, receipts,
    custom fields) and webhooks.
  entries:
  - label: Per User
    name: expense_per_user
    type: usage
    metric: users
    limit: -1
    timeFrame: month
    geo: global
    unit: 1
    price: approximately $15 per user per month (contact sales; free for a small number of users)
    userMultiplied: true
  elements:
  - name: Expense Management
  - name: Corporate Cards
  - name: Expense API
  - name: Webhooks
  - name: Receipt Management
- id: navan-enterprise
  name: Enterprise (Unified T&E)
  type: enterprise
  description: >-
    Custom agreement combining travel and expense for larger organizations, with
    negotiated volume pricing, dedicated support, SSO/SCIM provisioning,
    advanced controls, and SLAs. Contact Navan sales.
  entries:
  - label: Enterprise Agreement
    name: enterprise
    type: flat
    metric: contract
    limit: -1
    timeFrame: year
    geo: global
    unit: 1
    price: contact sales
    userMultiplied: false
  elements:
  - name: Unified Travel and Expense
  - name: Volume Pricing
  - name: Dedicated Support and SLAs
  - name: SSO and SCIM Provisioning
maintainers:
- FN: Kin Lane
  email: kin@apievangelist.com

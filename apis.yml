- aid: navan:navan-users-api
  name: Navan Users API
  tags:
  - Users
  - User Management
  - SCIM
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.navan.com/api/
  baseURL: https://api.navan.com/travel/v1
  properties:

name: Navan
kind: company
description: Navan (formerly TripActions, rebranded to Navan in February 2022) is a
  corporate travel, expense, and corporate card management platform. Its public
  developer surface centers on the Navan Expense API (OAuth 2.0 client-credentials)
  for retrieving and updating transactions, fees, adjustments, receipts, and custom
  fields, plus a Travel/User Management API for provisioning users and reading
  booking data, and webhooks for change notifications. Navan also publishes an MCP
  server for connecting AI assistants to Navan data. Booking (travel) is offered at
  no platform cost and funded by supplier commissions and per-trip fees, while
  Expense is a per-user subscription.

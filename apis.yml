    type: Documentation
  - url: openapi/navan-openapi.yml
    type: OpenAPI
  - url: collections/navan.postman_collection.json
    type: PostmanCollection
  - url: collections/navan.opencollection.json
    type: OpenCollection
  description: List, retrieve, create, update, and deactivate Navan users under the
    travel/v1 surface with cursor-based pagination and users:read / users:write /
    users:delete scopes. Deactivation is a soft delete. Endpoints confirmed against
    third-party user-management integration documentation.
- aid: navan:navan-bookings-api
  name: Navan Bookings API
  tags:
  - Bookings
  - Trips
  - Travel
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://app.navan.com/app/helpcenter/articles/travel/admin/other-integrations/booking-data-integration
  baseURL: https://api.navan.com/travel/v1
  properties:
  - url: https://app.navan.com/app/helpcenter/articles/travel/admin/other-integrations/booking-data-integration
    type: Documentation
  - url: openapi/navan-openapi.yml
    type: OpenAPI
  - url: collections/navan.postman_collection.json
    type: PostmanCollection
  - url: collections/navan.opencollection.json
    type: OpenCollection
  description: Read booking (trip) records so travel data can be transferred to
    downstream ERP, data-warehouse, and reporting systems, mirroring the columns of
    Navan's booking report. The bookings:read scope is confirmed; the exact endpoint
    paths are modeled from Navan's booking-data integration documentation because the
    full reference is gated.
- aid: navan:navan-webhooks-api
  name: Navan Webhooks API
  tags:
  - Webhooks
  - Events
  - Notifications
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.navan.com/api/
  baseURL: https://api.navan.com/v1/expense
  properties:
  - url: https://developer.navan.com/api/
    type: Documentation
  - url: openapi/navan-openapi.yml
    type: OpenAPI
  - url: collections/navan.postman_collection.json
    type: PostmanCollection
  - url: collections/navan.opencollection.json
    type: OpenCollection
  description: Register and manage webhook subscriptions so Navan can POST change
    notifications (for example transaction and expense events) to your endpoint. The
    Navan Expense API advertises webhooks as a first-class feature; the subscription
    management endpoint paths are modeled because the detailed webhook reference is
    gated. There is no public WebSocket API - server-push is delivered via webhooks.

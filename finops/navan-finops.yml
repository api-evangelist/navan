description: >-
  FinOps view of Navan (formerly TripActions) spend. Navan is a SaaS travel,
  expense, and corporate card platform rather than a metered API product, so
  spend is driven by the underlying subscription and travel activity, not by API
  call volume. The dominant cost drivers are: per-user Expense subscription
  seats (approx $15/user/month), per-trip travel booking/service fees (Business
  Travel has no platform fee and is funded by supplier commissions plus booking
  fees), corporate-card program economics (interchange, FX, rebates), and any
  Enterprise agreement for unified T&E. The developer API itself is included
  with the subscription and does not carry a separate per-call charge; it is
  primarily a lever for spend visibility and reconciliation rather than a cost.
notes: >-
  Per-user rates, free-user thresholds, and booking-fee schedules are
  contract-specific and not reconciled here. The API is a FinOps enabler:
  pulling card, Connect, manual, fee, adjustment, rebate, and dispute
  transactions plus booking data lets finance teams allocate T&E spend to cost
  centers via custom fields.

meters:
- name: expense_user_seats
  description: Active Expense users billed per user per month.
  unit: users
  aggregation: max
  dimensions:
  - account
  - department
  - costCenter
- name: booking_fees
  description: Per-trip booking / service fees on travel reservations.
  unit: bookings
  aggregation: sum
  dimensions:
  - account
  - travelerId
  - bookingType
- name: card_spend
  description: Corporate card transaction volume settled through Navan cards and Connect.
  unit: currency
  aggregation: sum
  dimensions:
  - account
  - userId
  - customField
- name: fees_and_adjustments
  description: Platform, FX, and reimbursement fees plus credit/debit adjustments, rebates, and disputes.
  unit: currency
  aggregation: sum
  dimensions:
  - account
  - feeType
principles:
- name: Visibility
  description: Pull card, Connect, manual, fee, adjustment, rebate, and dispute transactions plus booking data via the API to see all T&E spend in one place.
- name: Allocation
  description: Use custom fields (cost center, department, GL) to map every transaction and booking to an internal owner.
- name: Optimization
  description: Enforce travel policy at booking, consolidate cards through Navan, and reconcile expenses automatically to cut leakage and manual effort.
- name: Accountability
  description: Assign expense owners and managers per user; review per-cost-center spend monthly against budget.
